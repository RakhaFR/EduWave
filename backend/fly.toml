app = 'eduwave-backend'
primary_region = 'sin'

[build]

[env]
APP_NAME     = "EduWave"
APP_ENV      = "production"
APP_DEBUG    = "false"
APP_URL      = "https://eduwave-backend.fly.dev"
LOG_LEVEL    = "error"
LOG_CHANNEL  = "stderr"
LOG_STACK    = "stderr"

SESSION_DRIVER    = "database"
QUEUE_CONNECTION  = "database"
CACHE_STORE       = "database"
FILESYSTEM_DISK   = "public"
BROADCAST_CONNECTION = "log"

DB_CONNECTION = "mysql"
DB_HOST = "eduwave-mysql.internal"
DB_PORT = "3306"
DB_DATABASE = "eduwave"
DB_USERNAME = "eduwave"

[[services]]
internal_port = 8080
protocol      = "tcp"

[[services.ports]]
handlers = ["http"]
port     = 80
force_https = true

[[services.ports]]
handlers = ["tls", "http"]
port     = 443

[services.concurrency]
type       = "connections"
hard_limit = 25
soft_limit = 20

[[services.http_checks]]
interval      = 30000
timeout       = 5000
grace_period  = "10s"
method        = "GET"
path          = "/up"
protocol      = "http"

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
